<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .map-container {
            height: calc(100vh - 64px);
            width: 100%;
        }

        .pulse-dot {
            position: relative;
            width: 10px;
            height: 10px;
            background-color: currentColor;
            border-radius: 50%;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            top: -150%;
            left: -150%;
            width: 400%;
            height: 400%;
            border-radius: 50%;
            background-color: currentColor;
            opacity: 0.3;
            animation: pulse-wave 2s infinite ease-out;
        }

        @keyframes pulse-wave {
            0% { transform: scale(0.2); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>

<script>
        // Simple Interaction logic for demo
        document.addEventListener('DOMContentLoaded', () => {
            const bottomSheet = document.querySelector('.bottom-sheet');

            const pulseDots = document.querySelectorAll('.pulse-dot');
            pulseDots.forEach(dot => {
                dot.parentElement.parentElement.style.cursor = 'pointer';
                dot.parentElement.parentElement.addEventListener('click', () => {

                    console.log('Neighborhood selected');

            });

            // Randomizing the intervention progress bar for "live" feel
            const progressBar = document.querySelector('.bg-primary.h-full');
            setInterval(() => {
                const currentWidth = parseInt(progressBar.style.width);
                if (currentWidth < 98) {
                    const newWidth = currentWidth + (Math.random() * 0.5);
                    progressBar.style.width = `${newWidth}%`;
                }
            }, 3000);
        });
